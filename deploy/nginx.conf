server {
    listen 8080;
    server_name _;
    access_log off;
    client_max_body_size 48k;
    client_body_timeout 10s;
    location / {
        proxy_pass http://api:8000;
        proxy_read_timeout 65s;
        proxy_connect_timeout 3s;
        proxy_buffering off;
        proxy_set_header Host $host;
    }
}
