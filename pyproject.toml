[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "skillbook"
version = "0.1.0"
description = "Auditable local AI tool gateway and signed offline skill releases"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = [
  "cryptography>=44,<49",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.32,<1",
]

[project.scripts]
skillbook = "skillbook.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "cyclonedx-bom>=7,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=skillbook --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
